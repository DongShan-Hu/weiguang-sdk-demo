<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>微光 · SDK 验证小程序</title>
<style>
body{font:16px/1.8 system-ui;background:#f6f5fa;color:#292338;max-width:760px;margin:6vh auto;padding:0 20px}
section{background:#fff;border-radius:12px;padding:20px 24px;margin:18px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 8px}
button{font:inherit;padding:8px 16px;background:#6e52c5;color:#fff;border:0;border-radius:8px;cursor:pointer;margin-right:8px}
button:disabled{background:#b9b0d8;cursor:default}
textarea{display:block;width:100%;box-sizing:border-box;padding:10px;margin:10px 0;font:inherit;min-height:90px}
ul{padding-left:20px}li{margin:4px 0}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f1f8;border-radius:8px;padding:10px;font-size:13px}
.muted{color:#6b6480;font-size:14px}
</style>
</head>
<body>
<h1>SDK 验证小程序</h1>
<p class="muted">用来确认平台 SDK 在服务器上能存个人数据和文件，并且不同账号互相看不到。</p>

<section>
<h2>1. 我是谁</h2>
<button id="who">读取当前身份</button>
<pre id="identity">（还没读取）</pre>
</section>

<section>
<h2>2. 我的笔记（个人数据）</h2>
<p class="muted">只有你自己能看到这条笔记。</p>
<button id="load">读取我的笔记</button>
<textarea id="note" placeholder="先点“读取我的笔记”，再写点内容"></textarea>
<button id="save" disabled>保存</button>
<pre id="noteResult"></pre>
</section>

<section>
<h2>3. 我的文件（个人文件）</h2>
<p class="muted">只有你自己能看到和下载这些文件。</p>
<input type="file" id="file">
<button id="upload">上传</button>
<button id="list">列出我的文件</button>
<ul id="files"></ul>
<pre id="fileResult"></pre>
</section>

<script type="module">
import {createWeiguangSdk} from '/__wg/sdk/client.js';
const sdk=createWeiguangSdk();
const $=id=>document.getElementById(id);
let version=0;
const show=(el,value)=>{$(el).textContent=typeof value==='string'?value:JSON.stringify(value,null,2);};
async function run(el,fn){try{show(el,await fn());}catch(e){show(el,(e.code?e.code+'：':'')+e.message);}}

$('who').onclick=()=>run('identity',()=>sdk.context());

$('load').onclick=()=>run('noteResult',async()=>{
  try{const d=await sdk.documents.get('user','notes','main');version=d.version;$('note').value=d.value.text;$('save').disabled=false;return '已读取（版本 '+version+'）';}
  catch(e){if(e.code!=='DATA_NOT_FOUND')throw e;version=0;$('note').value='';$('save').disabled=false;return '还没有笔记，写点内容后保存';}
});
$('save').onclick=()=>run('noteResult',async()=>{
  const d=await sdk.documents.put('user','notes','main',{text:$('note').value},version);version=d.version;return '已保存（版本 '+version+'）';
});

async function listFiles(){
  const result=await sdk.files.list('user');
  const items=Array.isArray(result)?result:(result.items??result.files??[]);
  const ul=$('files');ul.textContent='';
  for(const f of items){
    const li=document.createElement('li');
    const a=document.createElement('a');a.href='#';a.textContent=(f.name??f.id)+'（'+(f.size??f.bytes??'?')+' 字节）';
    a.onclick=async event=>{event.preventDefault();try{const grant=await sdk.files.ticket(f.id);window.open(sdk.files.downloadUrl(f.id,grant.ticket),'_blank');}catch(e){show('fileResult',(e.code?e.code+'：':'')+e.message);}};
    li.append(a);ul.append(li);
  }
  return '共 '+items.length+' 个文件';
}
$('list').onclick=()=>run('fileResult',listFiles);
$('upload').onclick=()=>run('fileResult',async()=>{
  const file=$('file').files[0];if(!file)return '先选择一个文件';
  const uploaded=await sdk.files.upload('user',{name:file.name,contentType:file.type||'application/octet-stream',bytes:new Uint8Array(await file.arrayBuffer())});
  await listFiles();return {已上传:uploaded};
});
</script>
</body>
</html>
